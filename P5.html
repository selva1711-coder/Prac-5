<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navigation Bar</title>

 <style>
  body{
        margin:0;
        font-family: Arial, sans-serif;
        background-color:#f1f2f6;

    }

  .navbar{
     display:flex;
     align-items:center;
     background-color:#222222;
     height:100px;
     width:600px;
  }

  .navbar a{
    color:white;
    text-decoration:none;
    padding:25px 30px;
    font-size:20px;
    display:block;
  }

  .dropdown{
     position:relative;
   } 

  .dropbtn{
     color:white;
     padding:25px 35px;
     font-size:20px;
     cursor:pointer;
   }

  .dropdown-content{
       display:none;
       position:absolute;
       background-color:#111111;
       min-width:250px;
       z-index:1;
   }

   .dropdown-content a {
        padding:25px 35px;
     }

   .dropdown:hover .dropdown-content{
         display:block;
    }

  .navbar a:hover,
  .dropbtn:hover{
     background-color:#333333;
   }

   .login{
    background-color:#087df5;
    margin:10px;
    padding:15px 30px !important;
  }

  .signup{
     border:2px solid #087df5;
     margin:10px;
     padding:15px 13px !important;
   }

 </style>
</head>

<body>
  <div class="navbar">
  
   <a href="#">Blog</a>

  <div class="dropdown">
     <div class="dropbtn">Plans &#9662;</div>

    <div class="dropdown-content">
      <a href="#">Freelancer</a>
      <a href="#">Startup</a>
      <a href="#">Enterprise</a>
     </div>
   </div>

   <a href="#">Content</a>
   <a href="#" class="login">Log In</a>
   <a href="#" class="signup">Sign Up</a>

  </div>

</body>
</html>
